<article class="pub" id="{{ paper.id }}" data-year="{{ paper.year }}" data-topic="{{ paper.topic | escape }}"><div class="pub-year">{{ paper.year }}</div><div><h3>{{ paper.title | escape }}</h3><p class="authors">{{ paper.authors | escape }}</p><p class="venue">{{ paper.venue | escape }}</p><div class="pub-links">{% for link in paper.links %}<a href="{{ link[1] | escape }}">{{ link[0] | escape }} ↗</a>{% endfor %}</div>{% if paper.note != "" %}<p class="pub-note">{{ paper.note | escape }}</p>{% endif %}</div></article>
